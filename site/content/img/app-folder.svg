<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" font-family="Helvetica, Arial, sans-serif"><title>An app in a folder of its own</title><desc>Your computer holds a box for each app. Inside the box are the app and everything it needs. Your files are outside, and only open to the app if you allow it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="470" fill="#101825"/><text x="240" y="34" font-size="20" fill="#e8edf5" text-anchor="middle" font-weight="700">Your computer</text><rect x="24" y="52" width="432" height="236" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="175.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><rect x="44" y="76" width="250" height="190" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="169" y="176.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><text x="169" y="104" font-size="17" fill="#ffc61a" text-anchor="middle" font-weight="700">A folder for one app</text><rect x="62" y="122" width="214" height="40" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="169" y="147.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The app</text><rect x="62" y="172" width="214" height="40" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="169" y="197.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Its own libraries</text><rect x="62" y="222" width="214" height="36" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="169" y="245.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Its own settings</text><rect x="318" y="76" width="120" height="84" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="378" y="112.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Your</text><text x="378" y="134.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Documents</text><rect x="318" y="182" width="120" height="84" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="378" y="218.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Your</text><text x="378" y="240.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Pictures</text><line x1="294" y1="118" x2="318" y2="118" stroke="#b0bace" stroke-width="3" stroke-dasharray="3 6"/><text x="240" y="322" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The dotted line is a permission.</text><text x="240" y="346" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">It is shut until you switch it on.</text><rect x="44" y="374" width="392" height="70" rx="14" fill="#16223a" stroke="#ffc61a" stroke-width="2"/><text x="240" y="403.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Remove the app and the whole</text><text x="240" y="425.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">folder goes. Nothing is left behind.</text></svg>
