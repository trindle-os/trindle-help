<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" font-family="Helvetica, Arial, sans-serif"><title>The questions the installer asks</title><desc>Four questions in order: language, the disk, encryption and you. Then a last page called Ready that says the whole plan back to you. Nothing is written until you press Install.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="560" fill="#101825"/><rect x="20" y="14" width="440" height="76" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="57.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="52" r="15" fill="#ffc61a"/><text x="58" y="58" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">1</text><text x="90" y="48" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Language</text><text x="90" y="72" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">The keyboard and time follow it</text><line x1="240" y1="90" x2="240" y2="112" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="114" width="440" height="76" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="157.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="152" r="15" fill="#ffc61a"/><text x="58" y="158" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">2</text><text x="90" y="148" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">The disk</text><text x="90" y="172" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Whole disk, or share it</text><line x1="240" y1="190" x2="240" y2="212" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="214" width="440" height="76" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="257.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="252" r="15" fill="#ffc61a"/><text x="58" y="258" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">3</text><text x="90" y="248" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Encryption</text><text x="90" y="272" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">A password, the TPM chip, or none</text><line x1="240" y1="290" x2="240" y2="312" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="314" width="440" height="76" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="357.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="352" r="15" fill="#ffc61a"/><text x="58" y="358" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">4</text><text x="90" y="348" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">You</text><text x="90" y="372" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Your name, sign-in name, password</text><line x1="240" y1="390" x2="240" y2="412" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="414" width="440" height="76" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="457.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="452" r="15" fill="#ffc61a"/><text x="58" y="458" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">5</text><text x="90" y="448" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Ready</text><text x="90" y="472" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">The whole plan, in sentences</text><text x="240" y="540" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Nothing is written until you press Install.</text></svg>
