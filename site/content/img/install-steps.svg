<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" font-family="Helvetica, Arial, sans-serif"><title>Five steps from the image to a running Trindle</title><desc>Download the image, write it to a USB stick, start the computer from the stick, try Trindle, then install it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="560" fill="#101825"/><rect x="20" y="14" width="440" height="84" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="61.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="56" r="15" fill="#ffc61a"/><text x="58" y="62" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">1</text><text x="90" y="52" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Download the image</text><text x="90" y="78" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">One file, about 1 GB</text><line x1="240" y1="98" x2="240" y2="120" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="122" width="440" height="84" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="169.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="164" r="15" fill="#ffc61a"/><text x="58" y="170" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">2</text><text x="90" y="160" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Write it to a USB stick</text><text x="90" y="186" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Everything on the stick is replaced</text><line x1="240" y1="206" x2="240" y2="228" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="230" width="440" height="84" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="277.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="272" r="15" fill="#ffc61a"/><text x="58" y="278" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">3</text><text x="90" y="268" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Start from the stick</text><text x="90" y="294" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Hold the boot menu key at switch-on</text><line x1="240" y1="314" x2="240" y2="336" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="338" width="440" height="84" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="385.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="380" r="15" fill="#ffc61a"/><text x="58" y="386" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">4</text><text x="90" y="376" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Try Trindle</text><text x="90" y="402" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Nothing is written to the disk</text><line x1="240" y1="422" x2="240" y2="444" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="446" width="440" height="84" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="493.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="488" r="15" fill="#ffc61a"/><text x="58" y="494" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">5</text><text x="90" y="484" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Press Install Trindle</text><text x="90" y="510" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Nothing changes until the last page</text></svg>
