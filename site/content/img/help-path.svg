<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" font-family="Helvetica, Arial, sans-serif"><title>What to do when something goes wrong</title><desc>Read the label that Trindle shows where you are working. If that does not help, look on the Troubleshooting page. If you are still stuck, write a report.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="560" fill="#101825"/><rect x="20" y="20" width="440" height="96" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="73.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="68" r="15" fill="#ffc61a"/><text x="58" y="74" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">1</text><text x="90" y="64" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Read the label</text><text x="90" y="92" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">It says why, right where you work</text><line x1="240" y1="116" x2="240" y2="144" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="146" width="440" height="96" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="199.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="194" r="15" fill="#ffc61a"/><text x="58" y="200" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">2</text><text x="90" y="190" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Look at Troubleshooting</text><text x="90" y="218" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">The common problems and fixes</text><line x1="240" y1="242" x2="240" y2="270" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="272" width="440" height="96" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="325.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="320" r="15" fill="#ffc61a"/><text x="58" y="326" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">3</text><text x="90" y="316" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Still stuck? Write a report</text><text x="90" y="344" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Report a problem, in the ring</text><rect x="20" y="410" width="440" height="120" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="453.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">A report holds only your words, part</text><text x="240" y="475.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">of Trindle's log, the version and</text><text x="240" y="497.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">a summary of the computer.</text></svg>
