<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" font-family="Helvetica, Arial, sans-serif"><title>What Flow may and may not do</title><desc>Flow may control your keyboard, mouse and clipboard once you allow it. It cannot see your screen or your other windows. You can take it back in three ways.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="470" fill="#101825"/><text x="240" y="30" font-size="18" fill="#ffc61a" text-anchor="middle" font-weight="700">The plan: Flow is not built yet</text><rect x="20" y="52" width="210" height="110" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="125" y="79.63" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Flow may,</text><text x="125" y="101.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">once you allow it:</text><text x="125" y="123.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">use your keyboard,</text><text x="125" y="145.93" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">mouse and clipboard</text><rect x="250" y="52" width="210" height="110" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="355" y="79.63" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Flow cannot,</text><text x="355" y="101.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">even when allowed:</text><text x="355" y="123.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">see your screen or</text><text x="355" y="145.93" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">your other windows</text><text x="240" y="206" font-size="19" fill="#ffc61a" text-anchor="middle" font-weight="700">You can always take it back</text><rect x="20" y="224" width="440" height="56" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="257.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">A mark in every screen's corner names Flow</text><rect x="20" y="292" width="440" height="56" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="325.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Locking the screen hands them back</text><rect x="20" y="360" width="440" height="70" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="400.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Hold Ctrl, Alt and Shift for a second</text></svg>
