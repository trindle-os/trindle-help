<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" font-family="Helvetica, Arial, sans-serif"><title>How the lock screen lets you back in</title><desc>The screen locks. You type your password or PIN, or tap yes on your phone if Pocketkey is on. The screen opens. Notifications wait until then.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="560" fill="#101825"/><rect x="60" y="20" width="360" height="56" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="54.46" font-size="19" fill="#e8edf5" text-anchor="middle" font-weight="700">The screen locks</text><line x1="240" y1="76" x2="240" y2="108" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="110" width="360" height="76" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="142.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">It shows only the time,</text><text x="240" y="164.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">the date and a password box</text><line x1="240" y1="186" x2="240" y2="218" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="220" width="210" height="96" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="125" y="251.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Type your</text><text x="125" y="273.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">password or</text><text x="125" y="295.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">four-digit PIN</text><rect x="250" y="220" width="210" height="96" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="355" y="251.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Or tap yes on</text><text x="355" y="273.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">your phone</text><text x="355" y="295.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">(Pocketkey, if on)</text><line x1="125" y1="316" x2="200" y2="350" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><line x1="355" y1="316" x2="280" y2="350" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="352" width="360" height="56" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="386.46" font-size="19" fill="#e8edf5" text-anchor="middle" font-weight="700">The screen opens</text><rect x="40" y="440" width="400" height="94" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="470.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">While it is locked, no notification</text><text x="240" y="492.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">shows, not even its words.</text><text x="240" y="514.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">They wait for you in the ring.</text></svg>
