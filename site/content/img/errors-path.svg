<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" font-family="Helvetica, Arial, sans-serif"><title>From red words to the fix</title><desc>When something fails, red words say so where you are working, with a round More button beside them. More opens Help at the section for those words: what they mean, the likely causes, the steps to fix it, and the error exactly as the system said it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="520" fill="#101825"/><rect x="20" y="20" width="440" height="96" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="73.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="68" r="15" fill="#ffc61a"/><text x="58" y="74" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">1</text><text x="90" y="64" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Red words where it failed</text><text x="90" y="92" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">The system's own words, in Apps</text><line x1="240" y1="116" x2="240" y2="144" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="146" width="440" height="96" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="199.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="194" r="15" fill="#ffc61a"/><text x="58" y="200" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">2</text><text x="90" y="190" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Press More beside them</text><text x="90" y="218" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">The small round button</text><line x1="240" y1="242" x2="240" y2="270" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="272" width="440" height="96" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="325.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="320" r="15" fill="#ffc61a"/><text x="58" y="326" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">3</text><text x="90" y="316" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Help opens at that section</text><text x="90" y="344" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Meaning, causes and steps</text><rect x="20" y="410" width="440" height="90" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="449.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The error is shown as the system said</text><text x="240" y="471.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">it, so it can be copied into a report.</text></svg>
