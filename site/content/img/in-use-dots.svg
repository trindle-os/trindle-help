<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" role="img" font-family="Helvetica, Arial, sans-serif"><title>What the in-use dots mean</title><desc>Seven colours, one for each thing a program can be using: orange the microphone, green the camera, blue the screen being recorded, violet the mouse and keyboard, aqua the files you copied, magenta the home network, yellow scanners and USB devices.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="500" fill="#101825"/><text x="240" y="36" font-size="19" fill="#ffc61a" text-anchor="middle" font-weight="700">Each colour means one thing</text><rect x="20" y="62" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="91.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="86" r="10" fill="#fe9700"/><text x="80" y="92" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Microphone</text><rect x="20" y="122" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="151.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="146" r="10" fill="#019587"/><text x="80" y="152" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Camera</text><rect x="20" y="182" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="211.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="206" r="10" fill="#2295f1"/><text x="80" y="212" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Screen being recorded</text><rect x="20" y="242" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="271.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="266" r="10" fill="#9b6fd0"/><text x="80" y="272" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Mouse and keyboard</text><rect x="20" y="302" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="331.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="326" r="10" fill="#26b5a8"/><text x="80" y="332" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Files you copied</text><rect x="20" y="362" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="391.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="386" r="10" fill="#d4537e"/><text x="80" y="392" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Home network</text><rect x="20" y="422" width="440" height="48" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="451.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="52" cy="446" r="10" fill="#e8c11a"/><text x="80" y="452" font-size="18" fill="#e8edf5" text-anchor="start" font-weight="400">Scanners and USB devices</text></svg>
