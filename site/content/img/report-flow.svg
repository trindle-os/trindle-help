<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" font-family="Helvetica, Arial, sans-serif"><title>Where a report goes</title><desc>Two routes. In the Report a problem window you write what you were doing and press Send, which posts the report to Buildmorphic, or Save or Copy under Show details. After a crash Trindle asks whether to send a report, and you press Send or Don't send. Nothing is sent until you press Send.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="640" fill="#101825"/><text x="240" y="30" font-size="19" fill="#ffc61a" text-anchor="middle" font-weight="700">Report a problem window</text><rect x="30" y="48" width="420" height="50" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="78.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">You write what you were doing</text><line x1="240" y1="98" x2="240" y2="126" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="128" width="200" height="70" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="130" y="157.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Send</text><text x="130" y="179.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">to Buildmorphic</text><rect x="250" y="128" width="200" height="70" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="350" y="157.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Save or Copy</text><text x="350" y="179.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">under Show details</text><line x1="130" y1="198" x2="200" y2="230" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><line x1="350" y1="198" x2="280" y2="230" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="232" width="420" height="56" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="265.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Buildmorphic keeps it for the project</text><text x="240" y="318" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Nothing is sent until you press Send.</text><line x1="30" y1="346" x2="450" y2="346" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="384" font-size="19" fill="#ffc61a" text-anchor="middle" font-weight="700">After a crash</text><rect x="30" y="402" width="420" height="50" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="432.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">A Trindle program crashes</text><line x1="240" y1="452" x2="240" y2="480" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="482" width="420" height="50" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="240" y="512.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Trindle asks: Send a report?</text><line x1="240" y1="532" x2="240" y2="560" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="562" width="420" height="50" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="592.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">You press Send or Don't send</text></svg>
