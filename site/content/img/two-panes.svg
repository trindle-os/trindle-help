<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" width="480" height="430" role="img" font-family="Helvetica, Arial, sans-serif"><title>Folders with one pane or two</title><desc>Single: one list of files. Dual: two lists side by side with a strip of buttons between them.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="430" fill="#101825"/><text x="120" y="30" font-size="19" fill="#ffc61a" text-anchor="middle" font-weight="700">Single</text><rect x="20" y="44" width="200" height="190" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="120" y="133.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">One list</text><text x="120" y="155.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">of files</text><text x="360" y="30" font-size="19" fill="#ffc61a" text-anchor="middle" font-weight="700">Dual</text><rect x="250" y="44" width="90" height="190" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="295" y="133.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Left</text><text x="295" y="155.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">list</text><rect x="344" y="44" width="26" height="190" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="357" y="144.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><rect x="374" y="44" width="90" height="190" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="419" y="133.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Right</text><text x="419" y="155.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">list</text><text x="240" y="272" font-size="16" fill="#e8edf5" text-anchor="middle" font-weight="400">The strip between the panes can show this</text><text x="240" y="294" font-size="16" fill="#e8edf5" text-anchor="middle" font-weight="400">folder in the other pane, swap the panes,</text><text x="240" y="316" font-size="16" fill="#e8edf5" text-anchor="middle" font-weight="400">pick what differs, link them and compare.</text><rect x="40" y="346" width="400" height="60" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="240" y="381.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">F3 switches between one and two</text></svg>
