<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" font-family="Helvetica, Arial, sans-serif"><title>Every drive change asks for a password</title><desc>You ask for a change. Drives asks for an administrator password every time. With the password the change is made. Without it nothing changes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="520" fill="#101825"/><rect x="60" y="20" width="360" height="56" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="54.46" font-size="19" fill="#e8edf5" text-anchor="middle" font-weight="700">You ask to change a drive</text><line x1="240" y1="76" x2="240" y2="108" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="110" width="400" height="76" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="142.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">A box asks for an administrator's</text><text x="240" y="164.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">password, naming the drive</text><line x1="150" y1="186" x2="120" y2="238" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><line x1="330" y1="186" x2="360" y2="238" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="240" width="210" height="100" rx="14" fill="#16223a" stroke="#ffc61a" stroke-width="2"/><text x="125" y="273.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Password given</text><text x="125" y="295.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The change is made,</text><text x="125" y="317.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">and the row says what</text><rect x="250" y="240" width="210" height="100" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="355" y="273.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Box closed</text><text x="355" y="295.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Nothing changes,</text><text x="355" y="317.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">and a label says so</text><rect x="40" y="380" width="400" height="110" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="418.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">This holds for the system disk, a</text><text x="240" y="440.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">second disk and a USB stick. A</text><text x="240" y="462.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">password given earlier does not count.</text></svg>
