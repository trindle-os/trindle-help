<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" font-family="Helvetica, Arial, sans-serif"><title>When a game will not start</title><desc>Try four things in order: restart Steam, wait while the first start builds its shaders, try another Proton version, and sign in to the game's own launcher.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="560" fill="#101825"/><rect x="20" y="20" width="440" height="100" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="75.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="70" r="15" fill="#ffc61a"/><text x="58" y="76" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">1</text><text x="90" y="66" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Restart Steam</text><text x="90" y="94" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Close it fully, then open it again</text><line x1="240" y1="120" x2="240" y2="150" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="152" width="440" height="100" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="207.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="202" r="15" fill="#ffc61a"/><text x="58" y="208" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">2</text><text x="90" y="198" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Wait</text><text x="90" y="226" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">A first start builds its shaders</text><line x1="240" y1="252" x2="240" y2="282" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="284" width="440" height="100" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="339.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="334" r="15" fill="#ffc61a"/><text x="58" y="340" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">3</text><text x="90" y="330" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Try another Proton</text><text x="90" y="358" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Properties, then Compatibility</text><line x1="240" y1="384" x2="240" y2="414" stroke="#b0bace" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="416" width="440" height="100" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="471.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><circle cx="58" cy="466" r="15" fill="#ffc61a"/><text x="58" y="472" font-size="18" fill="#14100a" text-anchor="middle" font-weight="700">4</text><text x="90" y="462" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="700">Sign in to its launcher</text><text x="90" y="490" font-size="16" fill="#b0bace" text-anchor="start" font-weight="400">Alt-Tab finds a hidden window</text></svg>
