<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" font-family="Helvetica, Arial, sans-serif"><title>The fence round an AI program</title><desc>An AI program runs in a fence. Inside it sees the system, an empty private home and the folders you shared. Your documents, keys and passwords are outside, out of its sight.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="440" fill="#101825"/><text x="240" y="32" font-size="20" fill="#e8edf5" text-anchor="middle" font-weight="700">Your computer</text><rect x="24" y="50" width="190" height="250" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="119" y="180.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400"></text><text x="119" y="78" font-size="18" fill="#ffc61a" text-anchor="middle" font-weight="700">The fence</text><rect x="40" y="96" width="158" height="44" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="119" y="123.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The AI program</text><rect x="40" y="150" width="158" height="44" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="119" y="177.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The system</text><rect x="40" y="204" width="158" height="44" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="119" y="231.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">An empty home</text><rect x="40" y="258" width="158" height="32" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2"/><text x="119" y="279.44" font-size="16" fill="#e8edf5" text-anchor="middle" font-weight="400">Shared folders</text><rect x="280" y="70" width="176" height="56" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="368" y="103.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Your documents</text><rect x="280" y="140" width="176" height="56" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="368" y="173.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Your ssh keys</text><rect x="280" y="210" width="176" height="56" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="368" y="232.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Your passwords</text><text x="368" y="254.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">and browser</text><line x1="214" y1="168" x2="280" y2="168" stroke="#b0bace" stroke-width="3" stroke-dasharray="3 6"/><text x="240" y="336" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Outside the fence, out of its sight.</text><rect x="44" y="358" width="392" height="60" rx="14" fill="#16223a" stroke="#ffc61a" stroke-width="2"/><text x="240" y="393.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">You choose which folders to share.</text></svg>
