<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" font-family="Helvetica, Arial, sans-serif"><title>A disk and its parts</title><desc>One disk drawn as a bar of three parts: an older system that is kept, Trindle, and free space for a new part. Each part is called a partition.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="440" fill="#101825"/><text x="240" y="30" font-size="18" fill="#ffc61a" text-anchor="middle" font-weight="700">One disk, drawn as a bar (an example)</text><rect x="20" y="52" width="190" height="70" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="115" y="81.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Another</text><text x="115" y="103.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">system, kept</text><rect x="214" y="52" width="150" height="70" rx="14" fill="#1e2d4d" stroke="#ffc61a" stroke-width="2"/><text x="289" y="92.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="700">Trindle</text><rect x="368" y="52" width="92" height="70" rx="14" fill="#101825" stroke="#7f8fb0" stroke-width="2" stroke-dasharray="7 5"/><text x="414" y="81.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Free</text><text x="414" y="103.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">space</text><text x="240" y="166" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Each block is a partition,</text><text x="240" y="190" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">one named part of the disk.</text><rect x="20" y="224" width="440" height="78" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="257.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The installer, or Drives, can make a</text><text x="240" y="279.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">part smaller to open up free space</text><rect x="20" y="322" width="440" height="78" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="355.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Both systems then show in the</text><text x="240" y="377.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">boot menu when the computer starts</text></svg>
