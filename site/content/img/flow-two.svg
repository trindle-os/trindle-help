<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" font-family="Helvetica, Arial, sans-serif"><title>How Flow is meant to work</title><desc>Two computers side by side. The pointer leaves the right edge of the first screen and appears on the left edge of the second. The keyboard and the clipboard follow. This is the plan: Flow is not built yet.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0bace"/></marker></defs><rect width="480" height="470" fill="#101825"/><text x="240" y="30" font-size="18" fill="#ffc61a" text-anchor="middle" font-weight="700">The plan: Flow is not built yet</text><rect x="20" y="56" width="190" height="130" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="115" y="104.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Computer A</text><text x="115" y="126.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">keyboard and mouse</text><text x="115" y="148.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">are here</text><rect x="270" y="56" width="190" height="130" rx="14" fill="#16223a" stroke="#7f8fb0" stroke-width="2"/><text x="365" y="104.68" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Computer B</text><text x="365" y="126.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">no keyboard</text><text x="365" y="148.88" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">or mouse of its own</text><line x1="210" y1="120" x2="268" y2="120" stroke="#ffc61a" stroke-width="3" marker-end="url(#a)"/><text x="240" y="100" font-size="15" fill="#e8edf5" text-anchor="middle" font-weight="400">pointer</text><rect x="40" y="222" width="400" height="56" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="255.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">The keyboard and the clipboard follow</text><rect x="40" y="298" width="400" height="56" rx="14" fill="#1e2d4d" stroke="#7f8fb0" stroke-width="2"/><text x="240" y="331.78" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Push the pointer back to come home</text><rect x="40" y="374" width="400" height="70" rx="14" fill="#16223a" stroke="#ffc61a" stroke-width="2"/><text x="240" y="403.73" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">Hold Ctrl, Alt and Shift for a</text><text x="240" y="425.83" font-size="17" fill="#e8edf5" text-anchor="middle" font-weight="400">second and they come home</text></svg>
